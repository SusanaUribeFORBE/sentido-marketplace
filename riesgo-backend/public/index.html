<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiesGO! - Ingreso</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#0B1F3A" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="card">
    <img src="/assets/logo-riesgo.png" alt="RiesGO!" class="logo" />
    <p class="subtitle">Programa de gamificación en Seguridad y Salud en el Trabajo</p>

    <ul class="features">
      <li>🏆 Aprende SST jugando</li>
      <li>🎯 Acumula puntos y desbloquea insignias</li>
      <li>📜 Obtén tu certificado digital</li>
    </ul>

    <form id="login-form">
      <div class="field">
        <label for="codigo_pin">PIN de acceso</label>
        <input type="text" id="codigo_pin" name="codigo_pin" placeholder="RGO-XXXXXX" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="cedula_usuario">Cédula</label>
        <input type="text" id="cedula_usuario" name="cedula_usuario" placeholder="Número de cédula" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="nombre_usuario">Nombre completo</label>
        <input type="text" id="nombre_usuario" name="nombre_usuario" placeholder="Nombre y apellido" required autocomplete="off" />
      </div>
      <div class="field">
        <label for="cargo_usuario">Cargo</label>
        <input type="text" id="cargo_usuario" name="cargo_usuario" placeholder="Ej: Oficial de obra" autocomplete="off" />
      </div>
      <div class="field">
        <label for="celular_usuario">Celular</label>
        <input type="tel" id="celular_usuario" name="celular_usuario" placeholder="Número de celular" autocomplete="off" />
      </div>
      <div class="field checkbox-field">
        <label class="checkbox-label">
          <input type="checkbox" id="acepto_terminos" name="acepto_terminos" required />
          <span>Acepto de manera expresa los <a href="/privacidad.html" target="_blank" rel="noopener">Términos y Condiciones y la Política de Tratamiento de Datos Personales</a> de RiesGO! y FORBE SAS.</span>
        </label>
      </div>

      <button type="submit" id="submit-btn">Ingresar</button>
      <div id="message" class="message"></div>
    </form>

    <button type="button" id="install-btn" class="install-btn" hidden>📲 Instalar app</button>
  </div>

  <script src="/js/login.js"></script>
  <script src="/js/install.js"></script>
</body>
</html>
