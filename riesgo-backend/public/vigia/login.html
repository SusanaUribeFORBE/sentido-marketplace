<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vigía 360 — Acceso</title>
  <link rel="stylesheet" href="vigia.css" />
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }

    .login-box {
      background: var(--card);
      border-radius: 14px;
      box-shadow: 0 8px 32px rgba(26,58,92,.15);
      padding: 40px 44px;
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--border);
    }

    .login-brand {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 32px; justify-content: center;
    }
    .login-logo {
      width: 44px; height: 44px; background: var(--navy); border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .login-title { font-size: 28px; font-weight: 800; color: var(--navy); }
    .login-title span { color: var(--blue); font-style: italic; }

    .tab-bar {
      display: flex; gap: 0; border: 1.5px solid var(--border); border-radius: 8px;
      overflow: hidden; margin-bottom: 24px;
    }
    .tab {
      flex: 1; padding: 10px; text-align: center; font-size: 14px; font-weight: 600;
      cursor: pointer; background: transparent; border: none; color: var(--muted);
      transition: all .2s;
    }
    .tab.active { background: var(--navy); color: #fff; }

    .login-box h2 { font-size: 18px; color: var(--navy); margin-bottom: 20px; text-align: center; }

    .error-msg {
      background: var(--critico-bg); color: var(--critico);
      border: 1px solid #FABEC2; border-radius: 7px;
      padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none;
    }

    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 44px; }
    .pwd-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--muted); padding: 4px; display: flex; align-items: center;
      border-radius: 4px; transition: color .15s;
    }
    .pwd-toggle:hover { color: var(--navy); }

    .olvide-link {
      display: block; text-align: center; margin-top: 14px;
      font-size: 12.5px; color: var(--muted); cursor: pointer;
      text-decoration: none; transition: color .15s;
    }
    .olvide-link:hover { color: var(--blue); }

    .olvide-msg {
      display: none; margin-top: 12px;
      background: #EFF6FF; border: 1px solid #BFD7F0; border-radius: 8px;
      padding: 11px 14px; font-size: 12.5px; color: #1A3A5C; text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="login-brand" style="flex-direction:column;gap:6px">
    <svg xmlns="http://www.w3.org/2000/svg" width="72" height="80" viewBox="0 0 34 38">
      <path d="M17 1L2 7V21C2 30 9 37 17 39C25 37 32 30 32 21V7Z" fill="#1a3a5c"/>
      <circle cx="12" cy="19" r="4.5" fill="white" opacity="0.95"/>
      <circle cx="22" cy="19" r="4.5" fill="white" opacity="0.95"/>
      <circle cx="12" cy="19" r="2" fill="#1a3a5c"/>
      <circle cx="22" cy="19" r="2" fill="#1a3a5c"/>
      <circle cx="12.8" cy="18.2" r="0.7" fill="white"/>
      <circle cx="22.8" cy="18.2" r="0.7" fill="white"/>
      <polygon points="15,25 17,28 19,25" fill="#2E86AB" opacity="0.8"/>
    </svg>
    <div style="font-size:26px;font-weight:800;color:var(--navy);letter-spacing:1px">VIGÍA</div>
    <div style="font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase">Seguridad y Salud en el Trabajo</div>
  </div>

  <div class="tab-bar">
    <button class="tab active" id="tab-empresa" onclick="setTab('empresa')">Empresa</button>
    <button class="tab" id="tab-admin" onclick="setTab('admin')">Administrador</button>
  </div>

  <div id="error-msg" class="error-msg"></div>

  <!-- Login empresa -->
  <div id="form-empresa">
    <h2>Acceso empresas</h2>
    <form onsubmit="loginEmpresa(event)">
      <div class="form-group mb-4">
        <label>Nombre de la empresa</label>
        <input type="text" id="emp-nombre" placeholder="Ej: Fundación ProAves" required />
      </div>
      <div class="form-group mb-4" style="margin-bottom:24px">
        <label>Contraseña</label>
        <div class="pwd-wrap">
          <input type="password" id="emp-password" required />
          <button type="button" class="pwd-toggle" onclick="togglePwd('emp-password', this)" aria-label="Mostrar contraseña">
            <svg id="ico-emp-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="ico-emp-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-full" id="btn-empresa">Entrar →</button>
      <a class="olvide-link" onclick="toggleOlvide()">¿Olvidaste tu contraseña?</a>
      <div class="olvide-msg" id="olvide-msg">
        <form id="form-rec" onsubmit="recuperarPassword(event)">
          <p style="margin-bottom:10px;color:#1A3A5C;font-size:13px">Ingresa el nombre de tu empresa y te enviaremos un enlace para crear una nueva contraseña.</p>
          <input type="text" id="rec-nombre" placeholder="Nombre de tu empresa"
            style="width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:7px;
                   font-size:13px;margin-bottom:10px;background:var(--bg);color:var(--text);outline:none" />
          <button type="submit" class="btn btn-primary w-full" id="btn-rec" style="font-size:13px;padding:10px">
            Enviar enlace →
          </button>
        </form>
        <div id="rec-success" style="display:none;text-align:center;padding:6px 0">
          <div style="font-size:24px;margin-bottom:6px">✉️</div>
          <p style="color:#1E8449;font-size:13px;font-weight:600" id="rec-success-msg"></p>
        </div>
        <div id="rec-error" style="display:none;color:#C0392B;font-size:12.5px;text-align:center;margin-top:8px" id="rec-error-msg"></div>
      </div>
    </form>
  </div>

  <!-- Login admin -->
  <div id="form-admin" class="hidden">
    <h2>Acceso administrador</h2>
    <form onsubmit="loginAdmin(event)">
      <div class="form-group" style="margin-bottom:24px">
        <label>Contraseña de administrador</label>
        <div class="pwd-wrap">
          <input type="password" id="admin-password" required />
          <button type="button" class="pwd-toggle" onclick="togglePwd('admin-password', this)" aria-label="Mostrar contraseña">
            <svg id="ico-adm-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="ico-adm-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
              <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-navy w-full" id="btn-admin">Entrar como admin →</button>
    </form>
  </div>

  <p class="text-muted text-sm mt-6" style="text-align:center">
    Gestor de exámenes médicos ocupacionales SST
  </p>
</div>

<script>
  const API = 'https://riesgo-backend-production.up.railway.app/api/vigia';

  // Si ya hay sesión válida, redirigir al dashboard
  const token = localStorage.getItem('vigia_token');
  if (token) {
    fetch(`${API}/me`, { headers: { Authorization: `Bearer ${token}` } })
      .then(r => r.ok ? location.href = 'dashboard.html' : null)
      .catch(() => null);
  }

  function setTab(tab) {
    document.getElementById('tab-empresa').classList.toggle('active', tab === 'empresa');
    document.getElementById('tab-admin').classList.toggle('active', tab === 'admin');
    document.getElementById('form-empresa').classList.toggle('hidden', tab !== 'empresa');
    document.getElementById('form-admin').classList.toggle('hidden', tab !== 'admin');
    ocultarError();
  }

  async function loginEmpresa(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-empresa');
    btn.textContent = 'Verificando…'; btn.disabled = true;
    ocultarError();

    try {
      const resp = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo: 'empresa',
          nombre: document.getElementById('emp-nombre').value.trim(),
          password: document.getElementById('emp-password').value,
        })
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Error al iniciar sesión');
      guardarSesion(data);
    } catch (err) {
      mostrarError(err.message);
      btn.textContent = 'Entrar →'; btn.disabled = false;
    }
  }

  async function loginAdmin(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-admin');
    btn.textContent = 'Verificando…'; btn.disabled = true;
    ocultarError();

    try {
      const resp = await fetch(`${API}/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          tipo: 'admin',
          password: document.getElementById('admin-password').value,
        })
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Error al iniciar sesión');
      guardarSesion(data);
    } catch (err) {
      mostrarError(err.message);
      btn.textContent = 'Entrar como admin →'; btn.disabled = false;
    }
  }

  function guardarSesion(data) {
    localStorage.setItem('vigia_token',            data.token);
    localStorage.setItem('vigia_es_admin',         data.es_admin ? '1' : '0');
    localStorage.setItem('vigia_empresa_id',       data.empresa_id || '');
    localStorage.setItem('vigia_vigencia_meses',   String(data.vigencia_meses || 12));
    localStorage.setItem('vigia_num_trabajadores', data.num_trabajadores != null ? String(data.num_trabajadores) : '');
    localStorage.setItem('vigia_clase_riesgo',     data.clase_riesgo || '');
    localStorage.setItem('vigia_logo_url',         data.logo_url || '');
    localStorage.setItem('vigia_prefijo_docs',     data.prefijo_docs || 'SG-SST');
    localStorage.setItem('vigia_resp_estado',      data.resp_estado  || 'PENDIENTE');
    localStorage.setItem('vigia_vigencia_desde',   data.vigencia_docs_desde || '');
    localStorage.setItem('vigia_nit',              data.nit || '');
    location.href = 'dashboard.html';
  }

  function mostrarError(msg) {
    const el = document.getElementById('error-msg');
    el.textContent = msg; el.style.display = 'block';
  }

  function ocultarError() {
    document.getElementById('error-msg').style.display = 'none';
  }

  function togglePwd(inputId, btn) {
    const input = document.getElementById(inputId);
    const show  = btn.querySelector('[id$="-show"]');
    const hide  = btn.querySelector('[id$="-hide"]');
    const visible = input.type === 'text';
    input.type    = visible ? 'password' : 'text';
    show.style.display = visible ? '' : 'none';
    hide.style.display = visible ? 'none' : '';
  }

  function toggleOlvide() {
    const msg = document.getElementById('olvide-msg');
    msg.style.display = msg.style.display === 'block' ? 'none' : 'block';
    if (msg.style.display === 'block') {
      const nombre = document.getElementById('emp-nombre').value.trim();
      if (nombre) document.getElementById('rec-nombre').value = nombre;
    }
  }

  async function recuperarPassword(e) {
    e.preventDefault();
    const btn = document.getElementById('btn-rec');
    btn.textContent = 'Enviando…'; btn.disabled = true;
    document.getElementById('rec-error').style.display = 'none';

    try {
      const resp = await fetch(`${API}/recuperar-password`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nombre: document.getElementById('rec-nombre').value.trim() }),
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || 'Error al enviar');

      document.getElementById('form-rec').style.display = 'none';
      document.getElementById('rec-success-msg').textContent = data.mensaje;
      document.getElementById('rec-success').style.display = 'block';
    } catch (err) {
      document.getElementById('rec-error').textContent = err.message;
      document.getElementById('rec-error').style.display = 'block';
      btn.textContent = 'Enviar enlace →'; btn.disabled = false;
    }
  }
</script>
<script src="js/vigia-chat.js"></script>
</body>
</html>
