<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RiesGO! - Módulo</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <meta name="theme-color" content="#0B1F3A" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="card">
    <img src="/assets/logo-riesgo.png" alt="RiesGO!" class="logo" />
    <p class="subtitle">Bienvenido(a), <span id="nombre"></span></p>
    <p class="subtitle">Módulo asignado: <strong id="modulo"></strong></p>
    <p class="subtitle">Aquí irá el juego (mundo <span id="mundo"></span>). Próximamente.</p>
  </div>

  <script>
    const pinId = sessionStorage.getItem('riesgo_pin_id');
    if (!pinId) {
      window.location.href = '/';
    }
    document.getElementById('nombre').textContent = sessionStorage.getItem('riesgo_nombre') || '';
    document.getElementById('modulo').textContent = sessionStorage.getItem('riesgo_modulo') || '';
    document.getElementById('mundo').textContent = sessionStorage.getItem('riesgo_mundo') || '';
  </script>
</body>
</html>
