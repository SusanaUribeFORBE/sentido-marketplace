<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CREA IA — ¡Pago exitoso!</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #0A0620 0%, #150840 50%, #0D0A2E 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: #fff;
  }
  .orb { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(100px); }
  .orb-1 { width: 500px; height: 500px; background: rgba(109,40,217,.2); top: -150px; left: -100px; }
  .orb-2 { width: 350px; height: 350px; background: rgba(16,185,129,.12); bottom: -80px; right: -60px; }
  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,.06); backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 24px;
    padding: 52px 44px; max-width: 480px; width: 100%; text-align: center;
    box-shadow: 0 32px 80px rgba(0,0,0,.4);
  }
  .success-ring {
    width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 24px;
    background: radial-gradient(circle at 35% 35%, #6EE7B7, #10B981, #059669);
    display: flex; align-items: center; justify-content: center; font-size: 40px;
    box-shadow: 0 0 40px rgba(16,185,129,.5); animation: pop .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes pop { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
  h1 { font-size: 28px; font-weight: 900; margin-bottom: 10px; letter-spacing: -.5px; }
  .plan-name { font-size: 15px; color: rgba(255,255,255,.6); margin-bottom: 28px; }
  .plan-name strong { color: #A78BFA; font-weight: 700; }
  .divider { border: none; border-top: 1px solid rgba(255,255,255,.1); margin: 0 0 24px; }
  .next-steps { text-align: left; margin-bottom: 28px; }
  .next-steps p { font-size: 13px; color: rgba(255,255,255,.5); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }
  .step { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
  .step-num { width: 24px; height: 24px; border-radius: 50%; background: #7C3AED; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; margin-top: 1px; }
  .step-text { font-size: 14px; color: rgba(255,255,255,.8); line-height: 1.5; }
  .btn {
    display: block; width: 100%; padding: 15px;
    background: linear-gradient(135deg,#6D28D9,#7C3AED,#8B5CF6);
    border: none; border-radius: 13px; color: #fff;
    font-size: 15px; font-weight: 700; font-family: inherit;
    cursor: pointer; text-decoration: none; text-align: center;
    box-shadow: 0 4px 20px rgba(109,40,217,.4);
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(109,40,217,.55); }
  .logo-img { height: 32px; mix-blend-mode: screen; filter: drop-shadow(0 0 8px rgba(167,139,250,.5)); margin-bottom: 28px; }
</style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="card">
    <img src="/contenido/logo-crea.png" alt="CREA IA" class="logo-img">
    <div class="success-ring">✓</div>
    <h1>¡Pago exitoso!</h1>
    <p class="plan-name" id="plan-msg">Tu suscripción está activa.</p>
    <hr class="divider">
    <div class="next-steps">
      <p>Qué sigue</p>
      <div class="step"><div class="step-num">1</div><div class="step-text" id="step1-text">Crea tu cuenta con el correo con el que pagaste.</div></div>
      <div class="step"><div class="step-num">2</div><div class="step-text">Sube el logo y los colores de tu marca.</div></div>
      <div class="step"><div class="step-num">3</div><div class="step-text">El asistente CREA genera tu contenido en segundos.</div></div>
    </div>
    <a href="/contenido/registro.html" class="btn" id="btn-principal">Crear mi cuenta →</a>
    <a href="/contenido/login.html" id="link-login" style="display:block;margin-top:14px;font-size:12.5px;color:rgba(167,139,250,.6);text-decoration:none;text-align:center;">Ya tengo cuenta — Iniciar sesión →</a>
  </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const plan      = params.get('plan') || '';
  const reference = params.get('id') || params.get('reference') || '';
  const nombres   = { emprendedor: 'Plan Emprendedor', crecimiento: 'Plan Crecimiento', agencia: 'Plan Agencia', test: 'Plan Prueba' };
  const nombre    = nombres[plan] || 'tu plan';
  document.getElementById('plan-msg').innerHTML = `Suscripción <strong>${nombre}</strong> activa. ¡Bienvenido a CREA IA!`;

  // Si el usuario ya tiene sesión, llevar directo a la app
  const _sb = supabase.createClient('https://uerrimfgljuszxugnzxg.supabase.co','sb_publishable_g-QWziUfBuvcamoDFwdbng__cFVNj4G');
  _sb.auth.getSession().then(({ data: { session } }) => {
    if (session) {
      document.getElementById('btn-principal').href  = '/contenido/estrategia.html';
      document.getElementById('btn-principal').textContent = 'Entrar a CREA IA →';
      document.getElementById('step1-text').textContent = 'Tu cuenta ya tiene acceso completo al plan.';
      document.getElementById('link-login').style.display = 'none';
    }
  });

  // Verificar pago con el backend
  if (reference) {
    fetch(`/api/crea/verificar-pago?reference=${encodeURIComponent(reference)}`)
      .then(r => r.json())
      .then(d => { if (d.status === 'APPROVED') console.log('[CREA] Pago verificado:', d); })
      .catch(() => {});
  }
</script>
</body>
</html>
